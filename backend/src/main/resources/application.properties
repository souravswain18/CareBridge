spring.application.name=carebridge-backend
server.port=${PORT:8080}

# Dynamic Database Configuration (Default to embedded file database for zero-config cloud deployment, or use DB_URL if external MySQL provided)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/carebridge_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# JWT Configuration
carebridge.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
carebridge.jwt.expiration-ms=86400000

# Gemini AI API Key (Hidden via environment variable)
gemini.api.key=${GEMINI_API_KEY:}
